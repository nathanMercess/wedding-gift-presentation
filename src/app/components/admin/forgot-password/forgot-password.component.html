<main id="main-content" class="auth-page"><section class="auth-card">
  <a routerLink="/admin/login">← Voltar</a><h1>Esqueci minha senha</h1>
  <p>Enviaremos um link de redefinição quando o e-mail estiver cadastrado.</p>
  <form (ngSubmit)="submit()"><label for="forgotEmail">E-mail</label><input id="forgotEmail" type="email" name="email" [(ngModel)]="email" autocomplete="email" />
    <span *ngIf="submitted && !email.trim()" class="error">Informe o e-mail.</span>
    <button type="submit" [disabled]="auth.loginState().loading">{{ auth.loginState().loading ? 'Enviando...' : 'Enviar link' }}</button>
  </form>
  <div *ngIf="auth.loginState().success" class="success">Se o e-mail estiver cadastrado, o link será enviado.</div>
  <div *ngIf="auth.loginState().error" class="error-box">{{ auth.loginState().error }}</div>
</section></main>
