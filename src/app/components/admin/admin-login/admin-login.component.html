<div class="login-root">
  <div class="login-card">
    <div class="login-header">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="currentColor" class="brand-icon">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <h1>Painel de controle</h1>
      <p>Acesso administrativo</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="admin@exemplo.com"
          required
          class="text-input"
        />
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          class="text-input"
        />
      </div>

      <div *ngIf="auth.loginState().error" class="error-msg">{{ auth.loginState().error }}</div>

      <button type="submit" class="submit-btn" [disabled]="auth.loginState().loading">
        {{ auth.loginState().loading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
