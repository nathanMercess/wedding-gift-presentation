<div class="gift-card" (click)="onPresent()">
  <div class="image-wrap">
    <img [src]="gift().image" [alt]="gift().name" (error)="onImgError($event)" />
  </div>
  <div class="content">
    <h3>{{ gift().name }}</h3>
    <div class="progress-section">
      <div class="progress-labels">
        <span class="label">Arrecadado</span>
        <span class="values">R$ {{ gift().raised.toFixed(2) }} de R$ {{ gift().total.toFixed(2) }}</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="progressPercent"></div>
      </div>
    </div>
    <app-button [variant]="ButtonVariant.Primary" [size]="ButtonSize.Sm" style="width:100%">Presentear</app-button>
  </div>
</div>
