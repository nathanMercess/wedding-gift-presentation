<div class="login-root">
  <aside class="login-aside" aria-hidden="true">
    <img class="login-aside-img" src="assets/images/login-bg.jpg" alt="" />
    <div class="login-aside-overlay"></div>
    <div class="login-aside-content">
      <p class="login-aside-tag">Painel administrativo</p>
      <h2 class="login-aside-title">Cada detalhe da sua lista, sob controle.</h2>
    </div>
  </aside>

  <div class="login-main">
    <div class="login-card">
      <div class="login-header">
        <span class="brand-badge">
          <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand-icon">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <h1>Painel de controle</h1>
        <p>Acesso administrativo</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="admin@exemplo.com"
            required
            class="text-input"
          />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            required
            class="text-input"
          />
        </div>

        <div *ngIf="auth.loginState().error" class="error-msg">{{ auth.loginState().error }}</div>

        <button type="submit" class="submit-btn" [disabled]="auth.loginState().loading">
          {{ auth.loginState().loading ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    </div>
  </div>
</div>
