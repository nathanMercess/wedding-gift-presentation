<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div #modalContainer class="modal-container" [class.is-payment-step]="step === ModalStep.Payment" role="dialog"
    aria-modal="true" [attr.aria-labelledby]="modalTitleId" tabindex="-1">

    <!-- Grabber: affordance de bottom-sheet no mobile -->
    <div class="sheet-grabber" aria-hidden="true"></div>

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-header-left">
        <button *ngIf="step === ModalStep.Payment" type="button" class="back-btn" (click)="backToContribution()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6" />
          </svg>
          Voltar
        </button>
        <h2 [id]="modalTitleId">{{ modalTitle }}</h2>
      </div>
      <button type="button" class="close-btn" aria-label="Fechar" (click)="requestClose()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <!-- Content: sempre duas colunas (foto esquerda | etapas direita) -->
    <div class="modal-content">
      <div class="modal-grid">

        <!-- Esquerda: foto sempre visível -->
        <div class="gift-info">
          <app-gift-photo-card [gift]="currentGift" [giftDisplayMode]="giftDisplayMode()"
            [showCategory]="showGiftCategory()" [showProgress]="showGiftProgress()"
            [showContributionType]="showContributionType()">
          </app-gift-photo-card>
        </div>

        <!-- Direita: muda conforme step / disponibilidade -->
        <div class="right-side">

          <!-- Presente indisponível -->
          <div *ngIf="isUnavailable" class="completed-panel">
            <div class="completed-notice">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
              </svg>
              <div>
                <p class="completed-title">Presente indisponível</p>
                <p class="completed-sub">Este presente não está disponível para contribuição no momento.</p>
              </div>
            </div>
            <div class="completed-actions">
              <app-button [variant]="ButtonVariant.Primary" [type]="ButtonType.Button"
                (click)="close.emit()">Fechar</app-button>
            </div>
          </div>

          @switch (step) {
            @case (ModalStep.Contribution) {
              <div *ngIf="validationError" class="validation-alert" role="alert">{{ validationError }}</div>
              <app-gift-contribution-form *ngIf="!isUnavailable" [gift]="currentGift" [coupleName]="coupleName()"
                [giftDisplayMode]="giftDisplayMode()" [minAmount]="minAmount" [remaining]="contributionLimit"
                [availableQuickAmounts]="availableQuickAmounts" [initialData]="contributionFormData"
                [hasInitialData]="hasStoredContribution" [submitting]="validatingContribution"
                (submitted)="onContributionSubmit($event)" (cancelled)="requestClose()">
              </app-gift-contribution-form>
            }

            @case (ModalStep.Payment) {
              <app-gift-payment-step *ngIf="!isUnavailable" [gift]="currentGift" [giftId]="currentGift.id"
                [amount]="contributionAmount" [orderId]="orderId" [contributorName]="contributorName"
                [message]="contributorMessage" [resumePayment]="resumePayment()" (paymentResolved)="onPaymentResolved($event)">
              </app-gift-payment-step>
            }

            @case (ModalStep.Success) {
              <app-gift-success-step *ngIf="paymentResult as result" [result]="result" [coupleName]="coupleName()"
                (close)="closeAndRefresh()" (presentAnother)="closeAndRefresh()">
              </app-gift-success-step>
            }
          }

        </div>
      </div>
    </div>

  </div>

  <app-confirm-dialog *ngIf="showExitConfirm" title="Sair sem concluir?"
    message="Você tem dados preenchidos. Deseja realmente fechar sem concluir o presente?"
    confirmLabel="Fechar mesmo assim" cancelLabel="Continuar presenteando" (confirmed)="confirmExit()"
    (cancelled)="cancelExit()">
  </app-confirm-dialog>
</div>
