<form [formGroup]="form" (ngSubmit)="submit()" novalidate class="cartao-form">

  <div class="campo">
    <label for="cardNumber">Card number</label>
    <input
      id="cardNumber"
      type="text"
      formControlName="cardNumber"
      placeholder="0000 0000 0000 0000"
      maxlength="19"
      autocomplete="cc-number">
    <span
      class="erro-campo"
      *ngIf="form.get('cardNumber')?.invalid && form.get('cardNumber')?.touched">
      Enter a valid 16-digit card number.
    </span>
  </div>

  <div class="campos-linha">
    <div class="campo">
      <label for="expirationDate">Expiration date</label>
      <input
        id="expirationDate"
        type="text"
        formControlName="expirationDate"
        placeholder="MM/YY"
        maxlength="5"
        autocomplete="cc-exp">
      <span
        class="erro-campo"
        *ngIf="form.get('expirationDate')?.invalid && form.get('expirationDate')?.touched">
        Invalid date. Use MM/YY format.
      </span>
    </div>

    <div class="campo">
      <label for="cvv">CVV</label>
      <input
        id="cvv"
        type="text"
        formControlName="cvv"
        placeholder="123"
        maxlength="4"
        autocomplete="cc-csc">
      <span
        class="erro-campo"
        *ngIf="form.get('cvv')?.invalid && form.get('cvv')?.touched">
        Invalid CVV.
      </span>
    </div>
  </div>

  <div class="campo" *ngIf="isCreditCard">
    <label for="installments">Installments</label>
    <select id="installments" formControlName="installments">
      <option *ngFor="let n of installments" [value]="n">
        {{ n }}x of {{ totalAmount / n | currency:'BRL' }}
      </option>
    </select>
  </div>

  <div class="erro-global" *ngIf="error" role="alert">
    {{ error }}
  </div>

  <button
    type="submit"
    class="btn-pagar"
    [disabled]="form.invalid || loading">
    <span *ngIf="!loading">Pay {{ totalAmount | currency:'BRL' }}</span>
    <span *ngIf="loading">Processing...</span>
  </button>

</form>
