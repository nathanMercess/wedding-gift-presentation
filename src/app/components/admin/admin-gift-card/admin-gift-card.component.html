<div class="gift-card" [class.is-editing]="isEditing()">
  <div class="gift-card-image">
    <img *ngIf="gift().image" [src]="gift().image" [alt]="gift().name" loading="lazy" decoding="async" />
    <div *ngIf="!gift().image" class="gift-card-no-image">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <polyline points="21 15 16 10 5 21" />
      </svg>
    </div>
    <span class="gift-card-status" [class.available]="gift().available" [class.unavailable]="!gift().available">
      {{ gift().available ? 'Disponível' : 'Concluído' }}
    </span>
  </div>

  <div class="gift-card-body">
    <h3 class="gift-card-name" [title]="gift().name">{{ gift().name }}</h3>

    <div class="gift-card-progress">
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="getProgressPercent()"></div>
      </div>
      <div class="gift-card-values">
        <span class="raised">{{ gift().raised | currency:'BRL':'symbol':'1.2-2' }}</span>
        <span class="total">de {{ gift().total | currency:'BRL':'symbol':'1.2-2' }}</span>
      </div>
    </div>
  </div>

  <div class="gift-card-actions">
    <button class="btn-icon" (click)="edit.emit(gift())" title="Editar">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
      </svg>
      <span>Editar</span>
    </button>
    <button class="btn-icon danger" (click)="delete.emit(gift())" title="Remover">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6l-1 14H6L5 6" />
        <path d="M10 11v6" />
        <path d="M14 11v6" />
        <path d="M9 6V4h6v2" />
      </svg>
      <span>Remover</span>
    </button>
  </div>
</div>
