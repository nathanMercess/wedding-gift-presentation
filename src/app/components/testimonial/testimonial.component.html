<div class="testimonial-card">
  <div class="header">
    <div class="avatar">
      <img [src]="image" [alt]="names" (error)="onImgError($event)" />
    </div>
    <div>
      <h4>{{ names }}</h4>
      <p class="date">{{ date }}</p>
    </div>
  </div>
  <div class="stars">
    <svg *ngFor="let i of starsArray" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="star-icon">
      <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
    </svg>
  </div>
  <p class="text">"{{ text }}"</p>
</div>
