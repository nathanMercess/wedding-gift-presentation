<div class="checkout-container">
  <h2 class="checkout-title">Pagamento</h2>
  <p class="checkout-total">Total: {{ totalAmount | currency:'BRL' }}</p>

  <app-payment-method-selector
    *ngIf="!paymentApproved"
    [disabled]="paymentService.paymentState().submitting"
    (methodSelected)="onMethodSelected($event)">
  </app-payment-method-selector>

  <div class="checkout-form" *ngIf="activeMethod !== PaymentMethod.None && !paymentApproved">
    <app-card-brick
      *ngIf="activeMethod === PaymentMethod.CreditCard"
      [config]="cardConfig"
      (paymentApproved)="onPaymentApproved()"
      (paymentFailed)="onPaymentFailed($event)">
    </app-card-brick>

    <app-pix-display
      *ngIf="activeMethod === PaymentMethod.Pix"
      [orderId]="orderId"
      [giftId]="giftId"
      [giftName]="giftName"
      [contributorName]="contributorName"
      [message]="message"
      [amount]="totalAmount"
      (paymentApproved)="onPaymentApproved()"
      (retryRequested)="onPixRetryRequested()">
    </app-pix-display>
  </div>

  <div *ngIf="paymentApproved" class="checkout-success" role="status" aria-live="polite">
    Pagamento aprovado com sucesso.
  </div>
</div>
