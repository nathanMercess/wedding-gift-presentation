<main id="main-content" class="auth-page"><section class="auth-card">
  <a routerLink="/admin/login">← Voltar</a><h1>Redefinir senha</h1><p>Escolha uma nova senha com pelo menos oito caracteres.</p>
  <div *ngIf="!hasValidRequest" class="error-box">Este link de redefinição é inválido ou está incompleto. Solicite um novo link.</div>
  <form *ngIf="hasValidRequest" (ngSubmit)="submit()"><label for="newPassword">Nova senha</label><input id="newPassword" type="password" name="password" [(ngModel)]="password" autocomplete="new-password" />
    <label for="passwordConfirmation">Confirmar senha</label><input id="passwordConfirmation" type="password" name="confirmation" [(ngModel)]="confirmation" autocomplete="new-password" />
    <span *ngIf="submitted && password.length < 8" class="error">A senha deve ter pelo menos oito caracteres.</span>
    <span *ngIf="submitted && password !== confirmation" class="error">As senhas não coincidem.</span>
    <button type="submit" [disabled]="auth.loginState().loading">{{ auth.loginState().loading ? 'Salvando...' : 'Redefinir senha' }}</button>
  </form>
  <div *ngIf="auth.loginState().success" class="success">Senha redefinida. <a routerLink="/admin/login">Entrar</a></div>
  <div *ngIf="auth.loginState().error" class="error-box">{{ auth.loginState().error }}</div>
</section></main>
