<div class="form-card">
  <h3>{{ editingGift() ? 'Editar presente' : 'Novo presente' }}</h3>

  <!-- Enriquecimento via link (só ao criar) -->
  <ng-container *ngIf="!editingGift()">
    <div class="enrich-row">
      <input type="url" class="text-input" placeholder="Cole o link do produto para preencher automaticamente..."
        [(ngModel)]="enrichUrl" name="enrichUrl" />
      <button type="button" class="btn-outline" (click)="enrichFromLink()" [disabled]="enriching || !enrichUrl.trim()">
        {{ enriching ? 'Buscando...' : 'Preencher' }}
      </button>
    </div>
    <div *ngIf="enrichError" class="error-msg">{{ enrichError }}</div>
  </ng-container>

  <div class="form-grid" [formGroup]="form">
    <div class="form-group">
      <label>Nome</label>
      <input type="text" formControlName="name" class="text-input" placeholder="Nome do presente" />
      <p class="field-error" *ngIf="form.get('name')!.touched && form.get('name')!.hasError('required')">O nome é obrigatório.</p>
    </div>
    <div class="form-group">
      <label>Categoria</label>
      <select formControlName="category" class="text-input">
        <option *ngFor="let category of categories" [value]="category.id">{{ category.label }}</option>
      </select>
    </div>
    <div class="form-group">
      <label>Preço total (R$)</label>
      <input type="number" formControlName="total" class="text-input" placeholder="0.00" step="0.01" min="0.01" />
      <p class="field-error" *ngIf="form.get('total')!.touched && form.get('total')!.hasError('required')">Informe o valor total.</p>
      <p class="field-error" *ngIf="form.get('total')!.touched && form.get('total')!.hasError('min')">O valor deve ser maior que zero.</p>
    </div>
    <div class="form-group full-width">
      <label>Foto do presente</label>
      <div class="image-upload">
        <div class="image-preview">
          <img *ngIf="imageUrl" [src]="imageUrl" [alt]="form.get('name')!.value || 'Pré-visualização'" />
          <span *ngIf="!imageUrl" class="image-preview-placeholder">Sem foto</span>
        </div>
        <div class="image-upload-actions">
          <label class="btn-outline upload-btn">
            {{ giftService.adminState().imageUploading ? 'Enviando...' : 'Escolher foto' }}
            <input type="file" accept="image/jpeg,image/png,image/webp" (change)="onImageSelected($event)"
              [disabled]="giftService.adminState().imageUploading" hidden />
          </label>
          <p class="hint">JPG, PNG ou WEBP • até 20MB</p>
        </div>
      </div>
      <div *ngIf="giftService.adminState().imageUploadError" class="error-msg">
        {{ giftService.adminState().imageUploadError }}
      </div>
    </div>
    <div class="form-group full-width">
      <label>Descrição (opcional)</label>
      <textarea formControlName="description" class="text-input no-resize" rows="2"></textarea>
    </div>
    <div class="form-group full-width">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="allowPartialContribution" />
        Permitir contribuição parcial
      </label>
    </div>
  </div>

  <div *ngIf="giftService.adminState().giftError" class="error-msg">{{ giftService.adminState().giftError }}</div>
  <div class="form-actions">
    <button type="button" class="btn-outline" (click)="cancel.emit()">Cancelar</button>
    <button type="button" class="btn-primary" (click)="save()"
      [disabled]="form.invalid || giftService.adminState().giftSaving || giftService.adminState().imageUploading">
      {{ giftService.adminState().giftSaving ? 'Salvando...' : 'Salvar' }}
    </button>
  </div>
</div>
