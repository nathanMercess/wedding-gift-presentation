<div class="payment-step">
  <div class="payment-summary-bar">
    <span class="payment-gift-name">{{ giftName() }}</span>
    <span class="payment-total">{{ amount() | currency:'BRL' }}</span>
  </div>

  <app-payment-method-selector (methodSelected)="activeMethod = $event">
  </app-payment-method-selector>

  <ng-container *ngIf="activeMethod">
    <app-card-brick
      *ngIf="activeMethod === PaymentMethod.CreditCard || activeMethod === PaymentMethod.DebitCard"
      [config]="{ cardType: activeMethod, orderId: orderId(), giftId: giftId(), contributorName: contributorName(), message: message(), amount: amount(), payerEmail: '' }"
      (paymentApproved)="paymentApproved.emit()">
    </app-card-brick>

    <app-pix-display
      *ngIf="activeMethod === PaymentMethod.Pix"
      [orderId]="orderId()"
      [giftId]="giftId()"
      [contributorName]="contributorName()"
      [message]="message()"
      [amount]="amount()"
      (paymentApproved)="paymentApproved.emit()">
    </app-pix-display>
  </ng-container>

  <p *ngIf="!activeMethod" class="payment-hint">
    Escolha como deseja pagar para continuar.
  </p>
</div>

<!-- Overlay de processamento: feedback ao pagar + bloqueia duplo-clique -->
<div class="pay-processing" *ngIf="paymentService.paymentState().submitting" role="status" aria-live="polite">
  <div class="pay-progress-bar"><span></span></div>
  <div class="pay-processing-inner">
    <div class="pay-spinner"></div>
    <p>Processando pagamento…</p>
    <span class="pay-processing-sub">Aguarde, não feche esta tela</span>
  </div>
</div>
