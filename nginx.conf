server {
    listen ${PORT};

    client_max_body_size 25M;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/ {
        proxy_pass ${API_PROXY_URL}/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_method $request_method;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* "^/(?:.+/)?[^/]+-[a-z0-9]{8}\.(?:css|js|mjs|json|woff2?|png|jpe?g|gif|webp|avif|svg|ico)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
