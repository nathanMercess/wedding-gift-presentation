<div class="gift-card">
  <div class="card-image">
    <img [src]="gift().image" [alt]="gift().name" loading="lazy" decoding="async" (error)="onImgError($event)" />
    <div class="card-badge" *ngIf="!gift().available">Completo</div>
    <button type="button" class="card-hover-btn" (click)="onPresent()">Presentear</button>
  </div>
  <div class="card-body">
    <h3 class="card-name">{{ gift().name }}</h3>
    <div class="card-price">{{ gift().total | currency:'BRL':'symbol':'1.2-2' }}</div>
  </div>
</div>
