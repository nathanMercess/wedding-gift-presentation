<form [formGroup]="form" (ngSubmit)="confirm()" novalidate class="payer-form">

  <div class="field">
    <label for="payerEmail">E-mail</label>
    <input
      id="payerEmail"
      type="email"
      formControlName="email"
      placeholder="your@email.com"
      autocomplete="email">
    <span
      class="field-error"
      *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
      Enter a valid e-mail address.
    </span>
  </div>

  <div class="field">
    <label for="payerCpf">CPF</label>
    <input
      id="payerCpf"
      type="text"
      formControlName="cpf"
      placeholder="000.000.000-00"
      maxlength="14"
      inputmode="numeric"
      (input)="onCpfInput($event)">
    <span
      class="field-error"
      *ngIf="form.get('cpf')?.invalid && form.get('cpf')?.touched">
      Enter a valid 11-digit CPF.
    </span>
  </div>

  <button
    type="submit"
    class="btn-confirm"
    [disabled]="form.invalid">
    Continue to payment
  </button>

</form>
