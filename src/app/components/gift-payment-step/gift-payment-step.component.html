<div class="payment-step">
  <div class="payment-summary">
    <span>Presente</span>
    <strong>{{ gift().name }}</strong>
    <span>Total desta contribuicao</span>
    <strong>{{ amount() | currency:'BRL':'symbol':'1.2-2' }}</strong>
  </div>

  <p class="trust-note">Pagamento seguro via Mercado Pago. Voce pode voltar para conferir os dados antes de pagar.</p>

  <app-payment-method-selector [disabled]="paymentService.paymentState().submitting" (methodSelected)="onMethodSelected($event)">
  </app-payment-method-selector>

  <ng-container *ngIf="activeMethod !== PaymentMethod.None">
    <app-card-brick
      *ngIf="activeMethod === PaymentMethod.CreditCard"
      [config]="{ cardType: PaymentMethod.CreditCard, orderId: currentOrderId, giftId: giftId(), giftName: gift().name, contributorName: contributorName(), message: message(), amount: this.amount(), payerEmail: '', maxInstallments: maxInstallments }"
      (paymentResolved)="onPaymentResolved($event)"
      (paymentFailed)="onPaymentFailed($event)">
    </app-card-brick>

    <app-pix-display
      *ngIf="activeMethod === PaymentMethod.Pix"
      [orderId]="currentOrderId"
      [giftId]="giftId()"
      [giftName]="gift().name"
      [contributorName]="contributorName()"
      [message]="message()"
      [amount]="amount()"
      [resumePayment]="pixResumePayment"
      (pixReady)="onPixReady($event)"
      (paymentResolved)="onPaymentResolved($event)"
      (retryRequested)="onPixRetryRequested()"
      (cancelled)="onPixCancelled()">
    </app-pix-display>
  </ng-container>

  <p *ngIf="activeMethod === PaymentMethod.None" class="payment-hint">
    Escolha como deseja pagar para continuar.
  </p>
</div>

<!-- Overlay de processamento do cartão: feedback ao pagar + bloqueia duplo-clique -->
<div class="pay-processing" *ngIf="paymentService.paymentState().submitting" role="status" aria-live="polite">
  <div class="pay-progress-bar"><span></span></div>
  <div class="pay-processing-inner">
    <div class="pay-spinner"></div>
    <p>Processando pagamento…</p>
    <span class="pay-processing-sub">Aguarde, não feche esta tela</span>
  </div>
</div>
