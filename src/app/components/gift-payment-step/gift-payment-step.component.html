<div class="payment-step">
  <app-payment-method-selector (methodSelected)="activeMethod = $event">
  </app-payment-method-selector>

  <ng-container *ngIf="activeMethod">
    <app-card-brick
      *ngIf="activeMethod === PaymentMethod.CreditCard || activeMethod === PaymentMethod.DebitCard"
      [config]="{ cardType: activeMethod, orderId: orderId(), giftId: giftId(), contributorName: contributorName(), message: message(), amount: paymentAmount, netAmount: amount(), payerEmail: '', maxInstallments: maxInstallments }"
      (paymentApproved)="paymentApproved.emit()">
    </app-card-brick>

    <app-pix-display
      *ngIf="activeMethod === PaymentMethod.Pix"
      [orderId]="orderId()"
      [giftId]="giftId()"
      [contributorName]="contributorName()"
      [message]="message()"
      [amount]="amount()"
      (paymentApproved)="paymentApproved.emit()"
      (cancelled)="activeMethod = null">
    </app-pix-display>
  </ng-container>

  <p *ngIf="!activeMethod" class="payment-hint">
    Escolha como deseja pagar para continuar.
  </p>
</div>

<!-- Overlay de processamento do cartão: feedback ao pagar + bloqueia duplo-clique -->
<div class="pay-processing" *ngIf="paymentService.paymentState().submitting && (activeMethod === PaymentMethod.CreditCard || activeMethod === PaymentMethod.DebitCard)" role="status" aria-live="polite">
  <div class="pay-progress-bar"><span></span></div>
  <div class="pay-processing-inner">
    <div class="pay-spinner"></div>
    <p>Processando pagamento…</p>
    <span class="pay-processing-sub">Aguarde, não feche esta tela</span>
  </div>
</div>
