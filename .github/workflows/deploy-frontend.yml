name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Push and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Build Frontend image
        run: |
          docker build \
            -t southamerica-east1-docker.pkg.dev/weddinggift/wedding-gift/frontend:latest \
            -t southamerica-east1-docker.pkg.dev/weddinggift/wedding-gift/frontend:${{ github.sha }} \
            .

      - name: Push Frontend image
        run: |
          docker push southamerica-east1-docker.pkg.dev/weddinggift/wedding-gift/frontend:latest
          docker push southamerica-east1-docker.pkg.dev/weddinggift/wedding-gift/frontend:${{ github.sha }}

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet
            docker pull southamerica-east1-docker.pkg.dev/weddinggift/wedding-gift/frontend:latest
            cd /home/nathan66merces/app
            docker compose up -d frontend
            docker image prune -f
