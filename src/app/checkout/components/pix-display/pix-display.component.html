<div class="pix-container">

  <!-- Step 1: Payer data form -->
  <ng-container *ngIf="pixStep() === PixStep.Form">
    <div class="pix-intro">
      <div class="pix-icon">
        <svg width="32" height="32" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M389.6 354.4l-82.2-82.2a42.4 42.4 0 0 0-30-12.4h-42.8a42.4 42.4 0 0 0-30 12.4l-82.2 82.2a6 6 0 0 0 0 8.5l36.6 36.6a6 6 0 0 0 8.5 0l62.8-62.8a6 6 0 0 1 4.2-1.7h64.2a6 6 0 0 1 4.2 1.7l62.8 62.8a6 6 0 0 0 8.5 0l36.6-36.6a6 6 0 0 0 0-8.5zM389.6 149.6l-36.6-36.6a6 6 0 0 0-8.5 0l-62.8 62.8a6 6 0 0 1-4.2 1.7h-64.2a6 6 0 0 1-4.2-1.7l-62.8-62.8a6 6 0 0 0-8.5 0l-36.6 36.6a6 6 0 0 0 0 8.5l82.2 82.2a42.4 42.4 0 0 0 30 12.4h42.8a42.4 42.4 0 0 0 30-12.4l82.2-82.2a6 6 0 0 0 0-8.5z" fill="currentColor"/>
        </svg>
      </div>
      <p class="pix-intro-text">Informe seus dados para gerar o QR Code</p>
    </div>

    <form [formGroup]="payerForm" (ngSubmit)="generatePix()" novalidate class="pix-form">
      <div class="form-field">
        <label for="pixEmail">E-mail</label>
        <input
          id="pixEmail"
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
          autocomplete="email">
          <!-- =CLAUDE= ISSO É PARA SER AQUELE COMPONENTE GENERICO QUE USA O TOAST USAR MESMO COMPONENTE GENERICO EM TODOS OS COMENTARIOS DESSE-->
          <span class="field-error" *ngIf="payerForm.get('email')?.invalid && payerForm.get('email')?.touched">
            Informe um e-mail válido.
          </span>
        </div>

      <div class="form-field">
        <label for="pixCpf">CPF do pagador</label>
        <input
          id="pixCpf"
          type="text"
          formControlName="cpf"
          placeholder="000.000.000-00"
          maxlength="14"
          inputmode="numeric"
          (input)="onCpfInput($event)">
          <!-- =CLAUDE= ISSO É PARA SER AQUELE COMPONENTE GENERICO QUE USA O TOAST USAR MESMO COMPONENTE GENERICO EM TODOS OS COMENTARIOS DESSE-->
        <span class="field-error" *ngIf="payerForm.get('cpf')?.invalid && payerForm.get('cpf')?.touched">
          Informe um CPF válido com 11 dígitos.
        </span>
      </div>
      <button type="submit" class="btn-primary" [disabled]="payerForm.invalid">
        Gerar código PIX
      </button>
    </form>
  </ng-container>

  <!-- Loading -->
  <div *ngIf="pixStep() === PixStep.Loading" class="pix-loading">
    <div class="loading-spinner"></div>
    <p>Gerando seu PIX...</p>
  </div>

  <!-- Step 2: QR Code -->
  <ng-container *ngIf="pixStep() === PixStep.Qr && !expired() && !error()">
    <div class="qr-header">
      <p class="qr-instruction">Escaneie o QR Code ou copie o código abaixo</p>
      <span class="qr-timer">Expira em {{ formattedCountdown() }}</span>
    </div>

    <div class="qr-image-wrap">
      <img
        [src]="'data:image/png;base64,' + qrCodeBase64()"
        alt="QR Code PIX"
        width="220"
        height="220">
    </div>

    <div class="qr-code-block">
      <textarea class="qr-text" readonly [value]="qrCode()" rows="3" aria-label="Código PIX copia e cola"></textarea>
      <button type="button" class="btn-copy" (click)="copyCode()">
        <svg *ngIf="!copied()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <svg *ngIf="copied()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        {{ copied() ? 'Copiado!' : 'Copiar código' }}
      </button>
    </div>
  </ng-container>

  <div *ngIf="expired()" class="pix-expired" role="alert">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    PIX expirado.
    <button type="button" class="btn-retry" (click)="retryPix()">Gerar novo código</button>
  </div>

</div>
