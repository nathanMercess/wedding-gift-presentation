<main class="access-denied-root">
  <section class="access-denied-panel">

    <h1>Você não tem permissão para abrir esta área.</h1>
    <p>Volte ao login e entre com uma conta que tenha acesso a esta área.</p>
    <button type="button" class="back-link" (click)="backToLogin()">Voltar ao login</button>
  </section>
</main>
